defaults:
  - cotracker_kubric_base

epoch_len: 1000000
frames_per_sample: 24

traj_sampling:
  num_traj: 384 # null to keep all trajectories

providers_config:
  - name: dynamic_replica
    stride: 1
    weight: 1.0
    override_anno: null
    config:
      data_root: ${data_path:dynamic_replica_train_root}
      split: train
      keep_static_prob: 1.0
      dynamic_filter_threshold: 0.01
      is_train: true
      is_overfit: ${overfit}
